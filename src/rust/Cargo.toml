[workspace]
resolver = "2"
members = ["keel-core", "keel-store", "keel-resolve", "keel-graph", "keel-coord", "keel-brief", "keel-daemon", "keel-git", "keel-cmd", "keel-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"

# Optimize for the two things that matter: tiny startup and small binary.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
