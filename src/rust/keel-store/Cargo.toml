[package]
name = "keel-store"
version.workspace = true
edition.workspace = true
description = "keel native content-addressed object store — BLAKE3 addressing, canonical binary objects, LMDB backing"

[dependencies]
blake3 = "1"
heed = "0.20"
# pure-Rust DEFLATE (no C toolchain dep) — stored object/chunk values are compressed so a
# source tree doesn't cost MORE on disk than the raw files (see NEW-1109).
miniz_oxide = "0.8"
# ripgrep's gitignore matcher — real .gitignore/.keelignore semantics (anchoring, negation, **).
ignore = "0.4"
# advisory file locking (flock) so GC and commit are mutually exclusive across processes.
libc = "0.2"
# vetted AEAD (ChaCha20-Poly1305) + CSPRNG for crypto-shredding (NEW-1088). Already in the tree via
# keel-net's rustls, so this adds no new crypto vendor — we never hand-roll cryptography.
ring = "0.17"

[dev-dependencies]
keel-resolve = { path = "../keel-resolve" }
keel-graph = { path = "../keel-graph" }
