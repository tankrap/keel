[package]
name = "keel-graph"
version.workspace = true
edition.workspace = true
description = "keel live dependency graph — maintained over the working tree via the resolver sidecar, incrementally (only changed files re-resolve). The write-path-live graph a static index can't be."

[dependencies]
keel-resolve = { path = "../keel-resolve" }
# OS filesystem notifications, so refresh can be O(changed) instead of stat-ing the whole
# tree every call (NEW-1075 / NEW-1110): on the linux kernel that's 0.6 s → ~0 without a walk.
notify = "6"
